name: Manuscript evidence navigation

on:
  pull_request:
    paths:
      - README.md
      - docs/**
      - scripts/check_manuscript_evidence.py
      - .github/workflows/manuscript-evidence-navigation.yml
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - scripts/check_manuscript_evidence.py
      - .github/workflows/manuscript-evidence-navigation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-artifact-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manuscript Table 10 paths and Markdown links (read only)
        run: python3 scripts/check_manuscript_evidence.py
