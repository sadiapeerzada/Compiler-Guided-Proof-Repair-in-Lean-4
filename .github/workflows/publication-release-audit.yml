name: Publication hygiene and release inventory

on:
  pull_request:
    paths:
      - README.md
      - docs/**
      - publication/curated-release-20261107/**
      - scripts/audit_publication_surface.py
      - scripts/check_manuscript_evidence.py
      - .github/workflows/publication-release-audit.yml
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - publication/curated-release-20261107/**
      - scripts/audit_publication_surface.py
      - scripts/check_manuscript_evidence.py
      - .github/workflows/publication-release-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  curated-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manuscript navigation
        run: python3 scripts/check_manuscript_evidence.py
      - name: Check curated surface for unwanted identifiers
        run: python3 scripts/audit_publication_surface.py --scope curated --strict
      - name: Verify curated CSV source digests
        run: python3 publication/curated-release-20261107/verify_release.py
      - name: Inventory historical repository (informational only)
        run: python3 scripts/audit_publication_surface.py --scope full --report-json /tmp/lean4-publication-inventory.json
      - name: Publish read-only archive inventory for reviewer inspection
        uses: actions/upload-artifact@v4
        with:
          name: tracked-repository-hygiene-inventory
          path: /tmp/lean4-publication-inventory.json
          retention-days: 7
