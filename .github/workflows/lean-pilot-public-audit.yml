name: Lean pilot public evidence audit
on:
  pull_request:
    paths:
      - 'scripts/audit_study1_public.py'
      - 'tests/test_study1_public_audit.py'
      - '.github/workflows/lean-pilot-public-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check syntax
        run: python -B -m py_compile scripts/audit_study1_public.py tests/test_study1_public_audit.py
      - name: Verify released aggregates only
        run: python -B scripts/audit_study1_public.py
      - name: Run focused tests
        run: python -B -m unittest discover -s tests -p test_study1_public_audit.py -v
      - name: Run existing redacted-case verifier
        run: python -B publication/reanalyze.py
